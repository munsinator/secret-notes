services:
  database:
    image: postgres:17
    container_name: secret-notes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretuser
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: secretnotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: secret-notes-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://secretuser:secretpass@database:5432/secretnotes
      NODE_ENV: production
    ports:
      - "5001:5000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    container_name: secret-notes-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: