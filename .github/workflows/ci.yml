name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test -- --silent

  frontend-lint-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build-and-push:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-lint-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-backend:latest \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-frontend:latest \
            ./frontend

      - name: Push backend Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-backend:latest

      - name: Push frontend Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secret-notes-frontend:latest